function openHistory(code, name) {
  document.getElementById('modal-item-name').textContent = name || code;
  document.getElementById('modal-item-code').textContent = code;
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-loading"><div class="spinner"></div><div>Mengambil riwayat pembelian...</div></div>';
  document.getElementById('modal-footer').style.display = 'none';
  document.getElementById('modal-backdrop').classList.add('show');

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        document.getElementById('modal-body').innerHTML =
          '<div class="modal-empty">⚠️ '+escHtml((res&&res.error)||'Gagal memuat data')+'</div>';
        return;
      }
      renderHistoryModal(res.history || []);
    })
    .withFailureHandler(function(err) {
      document.getElementById('modal-body').innerHTML =
        '<div class="modal-empty">⚠️ '+escHtml(String(err))+'</div>';
    })
    .getVendorHistory(code);
}

function renderHistoryModal(history) {
  var body   = document.getElementById('modal-body');
  var footer = document.getElementById('modal-footer');

  if (!history || history.length === 0) {
    body.innerHTML = '<div class="modal-empty"><div style="font-size:32px;margin-bottom:10px;opacity:.3">📭</div><div>Tidak ada riwayat pembelian.</div></div>';
    footer.style.display = 'none';
    return;
  }

  var rows = history.map(function(h, i) {
    var isLatest = (i === 0);
    return '<tr class="'+(isLatest?'hist-latest':'')+'">'
      + '<td><span class="hist-no" style="'+(isLatest?'background:rgba(59,130,246,0.2);border-color:var(--accent);color:var(--accent2);':'')+'">'+( i+1)+'</span></td>'
      + '<td><span class="hist-date">'+escHtml(h.tanggal||'—')+'</span></td>'
      + '<td><span class="hist-vendor">'+escHtml(h.vendor||'—')+'</span></td>'
      + '<td class="hist-qty">'+( h.qty||0)+'</td>'
      + '<td><span class="hist-price">'+escHtml(h.hargaNormal||'—')+'</span></td>'
      + '<td><span class="hist-price-disc">'+escHtml(h.hargaDiskon||'—')+'</span></td>'
      + '<td><span class="hist-ket">'+escHtml(h.keterangan||'—')+'</span></td>'
      + '</tr>';
  }).join('');

  body.innerHTML =
    '<table class="hist-table">'
    + '<thead><tr>'
      + '<th style="width:36px">#</th>'
      + '<th>Tanggal</th>'
      + '<th>Vendor</th>'
      + '<th style="text-align:right">Qty</th>'
      + '<th>Harga Normal</th>'
      + '<th>Harga + Diskon</th>'
      + '<th>Keterangan</th>'
    + '</tr></thead>'
    + '<tbody>'+rows+'</tbody>'
    + '</table>';

  body.scrollTop = 0;
  footer.style.display = '';
  footer.textContent = 'Menampilkan ' + history.length + ' transaksi terakhir — terbaru di atas';
}

  for (var i = 1; i <= 12; i++) {
    /* Bulan ke-i yang lalu: misal sekarang Juni 2026, i=1 → Mei 2026, i=12 → Juni 2025 */
    var d = new Date(now.getFullYear(), now.getMonth() - i + 1, 0); // akhir bulan sebelumnya
    /* Koreksi: kita mau akhir bulan (i-1) dari sekarang */
    var target = new Date(now.getFullYear(), now.getMonth() - (i - 1), 0);
    /* Sebenarnya: bulan terbaru = bulan lalu, bulan terlama = 12 bulan lalu */
    /* Re-think: filter = 12 bulan terakhir. Jika sekarang Juni 2026:
       - Paling baru: akhir Mei 2026
       - Paling lama: akhir Juni 2025 */
    months.push(target);
  }
  return months;
}

function generatePushJualMonthOptions() {
  var now = new Date();
  var options = [];
  for (var i = 1; i <= 12; i++) {
    /* Akhir bulan ke-(current - i): new Date(year, month - i + 1, 0) */
    var endOfMonth = new Date(now.getFullYear(), now.getMonth() - i + 1, 0);
    /* Set ke 23:59:59 agar perbandingan buyDate < cutoff lebih aman */
    endOfMonth.setHours(23, 59, 59, 999);
    var label = endOfMonth.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
    /* Simpan sebagai timestamp number (hindari masalah timezone ISO) */
    var value = endOfMonth.getTime();
    options.push({ label: label, value: String(value), date: endOfMonth });
  }
  return options;
}

function renderPushJualView() {
  var area = document.getElementById('content-area');
  var months = generatePushJualMonthOptions();

  /* Gunakan pilihan tersimpan, atau default bulan terbaru (index 0) */
  var selectedVal = _pushJualSelectedMonth || months[0].value;

  var optionsHtml = months.map(function(m) {
    var sel = (String(m.value) === String(selectedVal)) ? ' selected' : '';
    return '<option value="' + escHtml(m.value) + '"' + sel + '>' + escHtml(m.label) + '</option>';
  }).join('');

  area.innerHTML =
    '<div class="pushjual-filter">'
      + '<label>FILTER BULAN CUTOFF:</label>'
      + '<select id="pushjual-month-select" onchange="fetchPushJualData()">' + optionsHtml + '</select>'
      + '<span class="pushjual-count" id="pushjual-count"></span>'
    + '</div>'
    + '<div id="pushjual-content"></div>';

  fetchPushJualData();
}

function fetchPushJualData() {
  var sel = document.getElementById('pushjual-month-select');
  if (!sel) return;
  var cutoffTs = parseInt(sel.value);
  var cutoff = new Date(cutoffTs);

  /* Simpan pilihan agar tidak reset saat pindah tab */
  _pushJualSelectedMonth = sel.value;

  var contentEl = document.getElementById('pushjual-content');

  /* Gunakan data yang sudah ada di _preloaded + lastBuyMap (CLIENT-SIDE, INSTAN) */
  var nbItems = filterPushJualFromPreloaded('Purchase NB', cutoff);
  var pcItems = filterPushJualFromPreloaded('Purchase PC', cutoff);

  _pushJualData = { nb: nbItems, pc: pcItems };
  renderPushJualTables(nbItems, pcItems);
}

/* Filter Push Jual dari data _preloaded + lastBuyMap — tanpa fetch server */
function filterPushJualFromPreloaded(sheetName, cutoff) {
  var payload = _preloaded[sheetName];
  if (!payload || !payload.report || !payload.report.departments) return [];

  var now = new Date();
  var items = [];

  payload.report.departments.forEach(function(dept) {
    if (!dept.items) return;
    dept.items.forEach(function(item) {
      if (!item.code) return;
      /* Stok = Sub Total + DP */
      var stokSubTotal = item.subTotal || 0;
      var stokDP = item.dp || 0;
      var stok = stokSubTotal + stokDP;
      if (stok <= 0) return;

      /* Detail stok per cabang + DP untuk popup */
      var stokDetailArr = [];
      if (item.stokCabang) {
        var CABANG_PUSH = ['YGY','SMG','SLO','PWT','BBS','TGL','MDN'];
        CABANG_PUSH.forEach(function(c){
          stokDetailArr.push(c + ':' + ((item.stokCabang && item.stokCabang[c]) || 0));
        });
      }
      stokDetailArr.push('DP:' + stokDP);
      var stokPopupData = stokDetailArr.join('|');

      var codeUpper = item.code.toUpperCase();
      var lb = lastBuyMap[codeUpper] || null;

      var lastBuyDate = '';
      var usia = '';
      var keterangan = '';

      if (!lb || !lb.tanggal) {
        keterangan = 'Copotan / Upgrade / Lebih dari 1 Tahun';
      } else {
        /* Parse tanggal dd/MM/yyyy */
        var parts = lb.tanggal.split('/');
        var buyDate = null;
        if (parts.length === 3) {
          buyDate = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        }

        if (!buyDate || isNaN(buyDate.getTime())) {
          keterangan = 'Copotan / Upgrade / Lebih dari 1 Tahun';
        } else if (buyDate >= cutoff) {
          /* Pembelian terakhir SETELAH atau SAMA DENGAN cutoff → TIDAK masuk push jual */
          return;
        } else {
          lastBuyDate = lb.tanggal;
          var diffMs = now.getTime() - buyDate.getTime();
          var diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          usia = diffDays + ' hari';
        }
      }

      items.push({
        code: item.code,
        name: item.name || item.code,
        stok: stok,
        stokPopup: stokPopupData,
        lastBuyDate: lastBuyDate,
        usia: usia,
        keterangan: keterangan
      });
    });
  });

  return items;
}

function renderPushJualTables(nbItems, pcItems) {
  var contentEl = document.getElementById('pushjual-content');
  var countEl = document.getElementById('pushjual-count');

  if (countEl) countEl.textContent = 'NB: ' + nbItems.length + ' | PC: ' + pcItems.length;

  contentEl.innerHTML =
    '<div class="pushjual-container">'
      + '<div class="pushjual-panel">'
        + '<div class="pushjual-header">PUSH JUAL &#8212; PURCHASE NB</div>'
        + '<div class="pushjual-table-wrap">' + buildPushJualTable(nbItems) + '</div>'
      + '</div>'
      + '<div class="pushjual-panel">'
        + '<div class="pushjual-header">PUSH JUAL &#8212; PURCHASE PC</div>'
        + '<div class="pushjual-table-wrap">' + buildPushJualTable(pcItems) + '</div>'
      + '</div>'
    + '</div>';
}

function buildPushJualTable(items) {
  if (!items || items.length === 0) {
    return '<div class="pushjual-empty">Tidak ada item push jual.</div>';
  }

  var rows = items.map(function(item) {
    var usiaClass = 'pj-usia';
    if (item.usia) {
      var usiaNum = parseInt(item.usia);
      if (usiaNum > 90) usiaClass = 'pj-usia-red';
    }

    var ketHtml = item.keterangan
      ? '<span class="pj-ket">' + escHtml(item.keterangan) + '</span>'
      : '<span style="color:var(--text3)">—</span>';

    return '<tr>'
      + '<td><button class="item-name-btn" data-code="'+escHtml(item.code)+'" data-name="'+escHtml(item.name)+'" onclick="openHistoryFromBtn(this)"><div class="item-name-inner"><span class="pj-name">' + escHtml(item.name) + '</span></div><span class="item-history-icon">⟶</span></button></td>'
      + '<td class="pj-stok td-allstok" data-stok="' + escHtml(item.stokPopup || '') + '">' + item.stok + '</td>'
      + '<td><span class="pj-date">' + escHtml(item.lastBuyDate || '—') + '</span></td>'
      + '<td><span class="' + usiaClass + '">' + escHtml(item.usia || '—') + '</span></td>'
      + '<td>' + ketHtml + '</td>'
      + '</tr>';
  }).join('');

  return '<table class="pushjual-table">'
    + '<colgroup><col style="width:auto"><col style="width:50px"><col style="width:100px"><col style="width:80px"><col style="width:260px"></colgroup>'
    + '<thead><tr>'
      + '<th>Nama Barang</th>'
      + '<th style="text-align:center">Stok</th>'
      + '<th>Beli</th>'
      + '<th>Usia</th>'
      + '<th>Keterangan</th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>';
}

// ========================================
// BELI — Rekomendasi pembelian SKU
// Logika: tampilkan SKU jika KIRA² Habis < PO Header
// PO Header dibaca dari row 1 sheet (kolom Y-AE), per sheet (NB/PC)
// ========================================
function switchToBeli(btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('search-input').value = '';
  _pushJualActive = false;
  _beliActive = true;
  destroyObserver();
  hideFilterBar();

  /* Pastikan kedua sheet sudah preloaded */
  var sheetsNeeded = ['Purchase NB', 'Purchase PC'];
  var missing = sheetsNeeded.filter(function(s){ return !_preloaded[s]; });

  if (missing.length > 0) {
    var area = document.getElementById('content-area');
    area.innerHTML = '<div class="loading-overlay"><div class="spinner"></div><div class="loading-text">Memuat data Order Beli...</div></div>';
    var promises = missing.map(function(s){ return fetchAll(s).then(function(p){ _preloaded[s] = p; }); });
    Promise.all(promises).then(function(){
      sheetsNeeded.forEach(function(s){
        var p = _preloaded[s];
        if (p && p.lastBuy && p.lastBuy.success && p.lastBuy.map) {
          Object.assign(lastBuyMap, p.lastBuy.map);
        }
      });
      renderBeliView();
    }).catch(function(err){
      document.getElementById('content-area').innerHTML =
        '<div class="empty-state"><div class="empty-icon">⚠️</div>Gagal memuat: '+escHtml(String(err))+'</div>';
    });
  } else {
    renderBeliView();
  }
}

function renderBeliView() {
  var area = document.getElementById('content-area');

  /* Ambil PO header per sheet untuk tampil di info */
  var poNB = getPOHeaderFromPreloaded('Purchase NB');
  var poPC = getPOHeaderFromPreloaded('Purchase PC');

  area.innerHTML =
    '<div class="beli-filter">'
      + '<label>FILTER:</label>'
      + '<div class="beli-filter-toggle" id="beli-filter-toggle">'
        + '<button class="'+(_beliFilter==='all'?'active':'')+'" onclick="setBeliFilter(\'all\')">Semua</button>'
        + '<button class="'+(_beliFilter==='NB'?'active':'')+'" onclick="setBeliFilter(\'NB\')">NB</button>'
        + '<button class="'+(_beliFilter==='PC'?'active':'')+'" onclick="setBeliFilter(\'PC\')">PC</button>'
      + '</div>'
      + '<div class="beli-info">PO NB: <b>'+poNB+' hari</b></div>'
      + '<div class="beli-info">PO PC: <b>'+poPC+' hari</b></div>'
      + '<div class="beli-count" id="beli-count"></div>'
    + '</div>'
    + '<div id="beli-content"></div>';

  renderBeliContent();
}

function setBeliFilter(filter) {
  _beliFilter = filter;
  /* Update tombol aktif */
  var toggle = document.getElementById('beli-filter-toggle');
  if (toggle) {
    toggle.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
    var idx = (filter === 'all') ? 0 : (filter === 'NB' ? 1 : 2);
    toggle.children[idx].classList.add('active');
  }
  renderBeliContent();
}

function getPOHeaderFromPreloaded(sheetName) {
  var p = _preloaded[sheetName];
  if (p && p.report && typeof p.report.poHeader === 'number' && p.report.poHeader > 0) {
    return p.report.poHeader;
  }
  return 21; /* fallback default */
}

function renderBeliContent() {
  var contentEl = document.getElementById('beli-content');
  var countEl = document.getElementById('beli-count');
  if (!contentEl) return;

  var items = [];
  if (_beliFilter === 'all' || _beliFilter === 'NB') {
    items = items.concat(filterBeliFromPreloaded('Purchase NB', 'NB'));
  }
  if (_beliFilter === 'all' || _beliFilter === 'PC') {
    items = items.concat(filterBeliFromPreloaded('Purchase PC', 'PC'));
  }

  if (countEl) {
    countEl.innerHTML = '<b>'+items.length+'</b> SKU perlu dibeli';
  }

  if (items.length === 0) {
    contentEl.innerHTML = '<div class="beli-empty">Tidak ada SKU yang perlu dibeli (semua KIRA² Habis ≥ PO Header).</div>';
    return;
  }

  contentEl.innerHTML = '<div class="beli-wrap">' + buildBeliTable(items) + '</div>';
}

/* Filter dari _preloaded — preserve urutan asli sheet */
function filterBeliFromPreloaded(sheetName, sourceLabel) {
  var payload = _preloaded[sheetName];
  if (!payload || !payload.report || !payload.report.departments) return [];

  var poHeader = getPOHeaderFromPreloaded(sheetName);
  /* Master map untuk lookup Note kolom M (hanya tersedia untuk Purchase NB) */
  var masterMap = (payload.master && payload.master.success && payload.master.map) ? payload.master.map : null;
  var items = [];

  payload.report.departments.forEach(function(dept) {
    if (!dept.items) return;
    dept.items.forEach(function(item) {
      if (!item.code) return;

      /* Parse nilai IKIRA² → bisa number atau string "21" / "" */
      var ikira = item.ikira2;
      var ikiraNum = NaN;
      if (typeof ikira === 'number') {
        ikiraNum = ikira;
      } else if (typeof ikira === 'string' && ikira.trim() !== '') {
        var parsed = parseFloat(ikira.replace(/[^0-9.\-]/g,''));
        if (!isNaN(parsed)) ikiraNum = parsed;
      }
      /* Hanya tampilkan jika ada nilai valid DAN < PO Header */
      if (isNaN(ikiraNum)) return;
      if (ikiraNum >= poHeader) return;

      /* Detail stok per cabang + DP untuk popup */
      var stokDetailArr = [];
      if (item.stokCabang) {
        ['YGY','SMG','SLO','PWT','BBS','TGL','MDN'].forEach(function(c){
          stokDetailArr.push(c + ':' + ((item.stokCabang && item.stokCabang[c]) || 0));
        });
      }
      stokDetailArr.push('DP:' + (item.dp || 0));

      /* Harga beli dari lastBuyMap */
      var lb = lastBuyMap[item.code.toUpperCase()] || null;
      var hargaBeli = (lb && lb.harga > 0) ? fmtRupiahJS(lb.harga) : '—';
      var hargaDate = (lb && lb.tanggal) ? lb.tanggal : '';

      /* Note + Harga ELS dari Master SKU (NB only). PC: kosong/0 */
      var note = '';
      var hargaEls = 0;
      if (masterMap) {
        var mEntry = masterMap[item.code.toUpperCase()];
        if (mEntry) {
          if (mEntry.note) note = String(mEntry.note);
          if (mEntry.harga > 0) hargaEls = mEntry.harga;
        }
      }

      items.push({
        source:      sourceLabel,
        dept:        dept.name || '',
        code:        item.code,
        name:        item.name || item.code,
        stokAll:     item.allStok || 0,
        stokPopup:   stokDetailArr.join('|'),
        allOut:      item.allOut || 0,
        kira2:       ikiraNum,
        poHeader:    poHeader,
        orderPlus:   item.orderPlus || 0,
        orderMinus:  item.orderMinus || 0,
        ketKsg:      String(item.ketKsg || ''),
        po:          String(item.po || ''),
        ketKeep:     item.ketKeep || 0,
        hargaBeli:   hargaBeli,
        hargaDate:   hargaDate,
        hargaEls:    hargaEls,
        note:        note
      });
    });
  });

  return items;
}

function buildBeliTable(items) {
  /* Helper: render KSG/PO/KEEP value cells (mirror style report table) */
  function _ksgCell(v) {
    var s = String(v || '').trim();
    if (!s || s === '0') return '<span class="beli-note empty">—</span>';
    if (s.toLowerCase() === 'ksg' || s === '1') return '<span class="badge-ksg">KSG</span>';
    if (s.toLowerCase() === 'bns') return '<span class="badge-bns">BNS</span>';
    return '<span class="beli-num">' + escHtml(s) + '</span>';
  }
  function _poCell(v) {
    var s = String(v || '').trim();
    return (s && s !== '0')
      ? '<span class="beli-num">' + escHtml(s) + '</span>'
      : '<span class="beli-note empty">—</span>';
  }
  function _keepCell(v) {
    var n = parseFloat(v) || 0;
    return n === 0
      ? '<span class="beli-note empty">—</span>'
      : '<span class="beli-num">' + n + '</span>';
  }

  var rows = items.map(function(it) {
    var srcClass = (it.source === 'NB') ? 'nb' : 'pc';
    var stokCls = it.stokAll > 0 ? 'beli-num' : 'beli-num zero';

    var hargaCell = '<span class="beli-hbeli">'+escHtml(it.hargaBeli)+'</span>';
    if (it.hargaDate) hargaCell += '<span class="beli-hbeli-date">'+escHtml(it.hargaDate)+'</span>';

    var hargaElsCell = (it.hargaEls > 0)
      ? '<span class="beli-hels">'+escHtml(fmtRupiahJS(it.hargaEls))+'</span>'
      : '<span class="beli-note empty">—</span>';

    return '<tr>'
      + '<td class="b-cen"><span class="beli-src '+srcClass+'">'+escHtml(it.source)+'</span></td>'
      + '<td class="b-lft"><span class="beli-dept">'+escHtml(it.dept)+'</span></td>'
      + '<td class="b-lft">'
        + '<button class="item-name-btn" '
          + 'onmouseenter="showTooltip(this)" onmouseleave="hideTooltip()" '
          + 'onmousemove="positionTooltip(event.clientX, event.clientY)" '
          + 'data-name="'+escAttr(it.name)+'" data-code="'+escAttr(it.code)+'" '
          + 'onclick="openHistoryFromBtn(this)">'
          + '<span class="beli-name">'+escHtml(it.name)+'</span>'
          + '<span class="beli-code">'+escHtml(it.code)+'</span>'
        + '</button>'
      + '</td>'
      + '<td class="b-cen td-allstok" data-stok="'+escHtml(it.stokPopup)+'"><span class="'+stokCls+'">'+it.stokAll+'</span></td>'
      + '<td class="b-cen"><span class="beli-num">'+(it.allOut||0)+'</span></td>'
      + '<td class="b-cen"><span class="beli-kira">'+it.kira2+'</span></td>'
      + '<td class="b-cen"><span class="beli-order-p'+(it.orderPlus===0?' zero':'')+'">'+(it.orderPlus||0)+'</span></td>'
      + '<td class="b-cen"><span class="beli-order-m'+(it.orderMinus===0?' zero':'')+'">'+(it.orderMinus||0)+'</span></td>'
      + '<td class="b-cen">'+_ksgCell(it.ketKsg)+'</td>'
      + '<td class="b-cen">'+_poCell(it.po)+'</td>'
      + '<td class="b-cen">'+_keepCell(it.ketKeep)+'</td>'
      + '<td class="b-rgt">'+hargaCell+'</td>'
      + '<td class="b-rgt">'+hargaElsCell+'</td>'
      + '<td class="b-lft" title="'+escAttr(it.note||'')+'"><span class="beli-note'+(it.note?'':' empty')+'">'+escHtml(it.note||'—')+'</span></td>'
      + '</tr>';
  }).join('');

  return '<table class="beli-table">'
    + '<colgroup>'
      + '<col style="width:54px">'   /* Source */
      + '<col style="width:120px">'  /* Dept */
      + '<col style="width:auto">'   /* Nama */
      + '<col style="width:80px">'   /* Stok */
      + '<col style="width:80px">'   /* All Out */
      + '<col style="width:90px">'   /* Kira² */
      + '<col style="width:90px">'   /* Order + */
      + '<col style="width:90px">'   /* Order - */
      + '<col style="width:70px">'   /* KSG */
      + '<col style="width:80px">'   /* PO */
      + '<col style="width:60px">'   /* KP (KEEP) */
      + '<col style="width:140px">'  /* Harga Beli */
      + '<col style="width:120px">'  /* Harga ELS */
      + '<col style="width:240px">'  /* Note */
    + '</colgroup>'
    + '<thead><tr>'
      + '<th class="b-cen">Sumber</th>'
      + '<th class="b-lft">Departemen</th>'
      + '<th class="b-lft">Nama Barang</th>'
      + '<th class="b-cen">ALL STOK</th>'
      + '<th class="b-cen">ALL OUT</th>'
      + '<th class="b-cen">KIRA²</th>'
      + '<th class="b-cen">ORDER (+)</th>'
      + '<th class="b-cen">ORDER (-)</th>'
      + '<th class="b-cen">KSG</th>'
      + '<th class="b-cen">PO</th>'
      + '<th class="b-cen">KP</th>'
      + '<th class="b-rgt">Harga Beli</th>'
      + '<th class="b-rgt">Harga ELS</th>'
      + '<th class="b-lft">Note</th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>';
}

// ========================================
// UTILS
// ========================================
function escHtml(str) {
  return String(str||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
function escAttr(str) {
  return String(str||'')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}
